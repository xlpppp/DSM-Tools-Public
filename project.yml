# Xcode project definition. Generate NASHelper.xcodeproj on a Mac with XcodeGen.
# Linux workflow tests DSMKit. The macOS workflow builds an unsigned IPA only when dispatched or tagged.
name: NASHelper
options:
  bundleIdPrefix: com.xlpppp
  deploymentTarget:
    iOS: "17.0"
packages:
  DSMKit:
    path: Packages/DSMKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
targets:
  NASHelper:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - package: DSMKit
        product: DSMKit
      - package: DSMKit
        product: DSMSSH
      - package: DSMKit
        product: MediaKit
      - package: SwiftTerm
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xlpppp.nashelper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NAS 助手
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 用于连接局域网内的群晖 NAS。
        NSPhotoLibraryAddUsageDescription: 用于把 NAS 上的照片和视频保存到相册。
        NSFaceIDUsageDescription: 用于在使用用户管理、文件服务、容器重建等管理功能前验证身份。
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.xlpppp.nashelper.alerts
        NSAppTransportSecurity:
          # NAS addresses are user-entered (LAN IPs, DDNS, custom ports), so ATS cannot list them.
          # HTTPS certificates are still validated; self-signed ones need explicit trust in the app.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
